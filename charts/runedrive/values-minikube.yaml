image:
  repository: ghcr.io/kaziksuper/runedrive
  tag: "1.8.0"
  pullPolicy: IfNotPresent

replicaCount: 5

rollout:
  enabled: true
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 60
        - pause: {duration: 30s}
        - setWeight: 80
        - pause: {duration: 30s}

existingSecret: runedrive-secret

config:
  ENVIRONMENT: "k8s-minikube"
  APP_ENV: "k8s-minikube"
  PROJECT_NAME: "RuneDrive API"
  DEBUG: "true"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "runedrive"
  POSTGRES_USER: "runedrive"
  REDIS_PORT: "6379"

env:
  - name: PROMETHEUS_ENABLED
    value: "true"
  - name: FAIL_RATE
    value: "0"

metrics:
  enabled: true
  path: /metrics
  interval: 15s
  scrapeTimeout: 10s

dashboard:
  enabled: true
  folder: RuneDrive

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: false

postgres:
  persistence:
    enabled: true
    size: 1Gi
    storageClass: standard
