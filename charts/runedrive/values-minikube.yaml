image:
  repository: ghcr.io/kaziksuper/runedrive
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 2

existingSecret: runedrive-secret

config:
  ENVIRONMENT: "k8s-minikube"
  APP_ENV: "k8s-minikube"
  PROJECT_NAME: "RuneDrive API"
  DEBUG: "true"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "runedrive"
  POSTGRES_USER: "runedrive"
  REDIS_PORT: "6379"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: false

postgres:
  persistence:
    enabled: true
    size: 1Gi
    storageClass: standard
