apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 93.4.0
    helm:
      valuesObject:
        fullnameOverride: kps
        # компоненти control plane minikube недоступні для скрейпу — вимикаємо, щоб не було шуму
        kubeEtcd: {enabled: false}
        kubeControllerManager: {enabled: false}
        kubeScheduler: {enabled: false}
        kubeProxy: {enabled: false}
        # менше рухомих частин: без admission webhook і його TLS-джобів
        prometheusOperator:
          admissionWebhooks: {enabled: false}
          tls: {enabled: false}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 256Mi}
        # кластер 5 GB: Alertmanager не використовуємо (автовідкат рахує AnalysisRun)
        alertmanager: {enabled: false}
        kube-state-metrics:
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 128Mi}
        prometheus:
          prometheusSpec:
            retention: 2d
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests: {cpu: 100m, memory: 400Mi}
              limits: {memory: 900Mi}
        grafana:
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          resources:
            requests: {cpu: 20m, memory: 128Mi}
            limits: {memory: 320Mi}
          # Grafana 13.3 на повільному ноді ініціалізується ~90 c, типовий liveness
          # -проб перезапускав контейнер у циклі; даємо запас на старт.
          livenessProbe:
            httpGet: {path: /api/health, port: 3000, scheme: HTTP}
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet: {path: /api/health, port: 3000, scheme: HTTP}
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 10
          sidecar:
            dashboards:
              searchNamespace: ALL      # шукати ConfigMap-и з дашбордами в усіх namespace
          additionalDataSources:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki-gateway.monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
