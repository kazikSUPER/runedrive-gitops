apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: runedrive
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kazikSUPER/runedrive-gitops.git
    targetRevision: main
    path: charts/runedrive
    helm:
      valueFiles:
        - values-minikube.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: runedrive
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
